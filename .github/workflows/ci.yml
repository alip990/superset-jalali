name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: pip install -e '.[dev]' && pytest -rs
        env:
          PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      - run: python -m build
      - name: Check wheel assets
        run: |
          python - <<'PY'
          import glob, json, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              manifest = json.loads(wheel.read('superset_jalali/static/manifest.json'))
              bundle = 'superset_jalali/static/' + manifest['bundle']
              assert bundle in wheel.namelist()
              assert wheel.read(bundle)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
